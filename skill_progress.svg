<svg width="900" height="120" viewBox="0 0 900 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Copyright (c) 2026 Chamath Sandaru. All rights reserved.
    Unauthorized use, copying, or redistribution of this asset is strictly prohibited.
    Repository: https://github.com/ChamathSadaru/ChamathSadaru
  -->
  <defs>
    <!-- Glassmorphism Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Linear Gradient for Tags -->
    <linearGradient id="tagGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0.02" />
    </linearGradient>

    <!-- Animated Pulse Gradient for Android Development -->
    <radialGradient id="pulseGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#3DDC84">
        <animate attributeName="stop-color" values="#3DDC84; #FFFFFF; #3DDC84" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2EA043" />
    </radialGradient>

    <filter id="textPulse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="1; 4; 1" dur="2s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Container -->
  <rect width="900" height="120" rx="60" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  
  <!-- Background Watermark -->
  <text x="450" y="60" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" font-family="Inter, system-ui, sans-serif" font-size="120" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.02em">ChamathZ</text>
  
  <!-- Icon Container -->
  <g transform="translate(60, 60)">
    <!-- Animated Outer Ring -->
    <circle r="42" fill="#161B22" stroke="#3DDC84" stroke-width="2.5" stroke-dasharray="160 100" stroke-linecap="round">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 0 0" 
        to="360 0 0" 
        dur="4s" 
        repeatCount="indefinite" />
    </circle>
    
    <!-- Animated Android Bugdroid Icon (Floating Effect) -->
    <g transform="translate(0, -3)">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0 -3; 0 -6; 0 -3" 
        dur="3s" 
        repeatCount="indefinite" 
        calcMode="spline" 
        keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      
      <!-- Antennae -->
      <line x1="-8" y1="-12" x2="-13" y2="-19" stroke="#3DDC84" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="8" y1="-12" x2="13" y2="-19" stroke="#3DDC84" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Head -->
      <path d="M -15,-3 A 15,15 0 0,1 15,-3 Z" fill="#3DDC84"/>
      <!-- Eyes -->
      <circle cx="-5.5" cy="-9" r="1.6" fill="#161B22"/>
      <circle cx="5.5" cy="-9" r="1.6" fill="#161B22"/>

      <!-- Body -->
      <path d="M -15,1 L 15,1 L 15,15 A 4,4 0 0,1 11,19 L -11,19 A 4,4 0 0,1 -15,15 Z" fill="#3DDC84"/>

      <!-- Arms -->
      <rect x="-20" y="1" width="3.2" height="13" rx="1.6" fill="#3DDC84"/>
      <rect x="16.8" y="1" width="3.2" height="13" rx="1.6" fill="#3DDC84"/>

      <!-- Legs -->
      <rect x="-9" y="19" width="3.4" height="7" rx="1.7" fill="#3DDC84"/>
      <rect x="5.6" y="19" width="3.4" height="7" rx="1.7" fill="#3DDC84"/>
    </g>
  </g>
  
  <!-- Title Section -->
  <g transform="translate(120, 21)">
    <circle cx="3" cy="5" r="3" fill="#3DDC84"/>
    <text x="13" y="10" fill="#3DDC84" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="0.1em">NOW I AM DEEP DIVING</text>
    <text y="40" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="900">Android <tspan fill="url(#pulseGradient)" filter="url(#textPulse)">Development</tspan></text>
    <text y="58" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400">Native Mobile Ecosystem</text>
  </g>

  <!-- Smart Tech Stack Highlights (Android Pillars) -->
  <g transform="translate(440, 20)">
    <!-- Point 1: Kotlin & Jetpack -->
    <g transform="translate(0, 0)">
      <rect width="162" height="24" rx="12" fill="url(#tagGradient)" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" repeatCount="indefinite" />
      </rect>
      <path d="M12 12h4m-2-2v4" stroke="#3DDC84" stroke-width="1.5" stroke-linecap="round"/>
      <text x="22" y="16" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800">Kotlin &amp; Jetpack</text>
    </g>
    
    <!-- Point 2: MVVM & Coroutines (Staggered) -->
    <g transform="translate(15, 28)">
      <rect width="162" height="24" rx="12" fill="url(#tagGradient)" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" begin="1s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="12" r="2.5" fill="#3DDC84" fill-opacity="0.8"/>
      <text x="24" y="16" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800">MVVM &amp; Coroutines</text>
    </g>
    
    <!-- Point 3: Room DB & Retrofit -->
    <g transform="translate(0, 56)">
      <rect width="162" height="24" rx="12" fill="url(#tagGradient)" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" begin="2s" repeatCount="indefinite" />
      </rect>
      <path d="M10 12l3 3 5-5" stroke="#3DDC84" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="22" y="16" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800">Room DB &amp; Retrofit</text>
    </g>
  </g>

  <!-- Utils / Tech Section (Next Move To Spring Boot) -->
  <g transform="translate(690, 46)">
    <!-- Next Move Label -->
    <text x="25" y="18" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="end" letter-spacing="0.02em">next move to</text>

    <!-- Smart Pill Design with Animated Border -->
    <g transform="translate(35, 0)">
      <rect width="95" height="28" rx="14" fill="#161B22" stroke="#2EA043" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="10 5">
        <animate attributeName="stroke-dashoffset" from="0" to="15" dur="3s" repeatCount="indefinite" />
      </rect>
      <circle cx="12" cy="14" r="2.5" fill="#2EA043"/>
      <text x="52" y="18" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Spring Boot</text>
    </g>
  </g>
</svg>
