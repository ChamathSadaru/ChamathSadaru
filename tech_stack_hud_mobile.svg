  <defs>
    <filter id="hudBlueGlowMobile" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <mask id="hudRoundCornersMobile">
      <rect width="450" height="690" rx="24" fill="white" />
    </mask>

    <pattern id="hudGridMobile" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="0.5"/>
    </pattern>

    <linearGradient id="hudShineMobile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="50%" stop-color="white" stop-opacity="0.12" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="chipGradMobile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#161B22" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="450" height="690" rx="24" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <rect width="450" height="690" rx="24" fill="url(#hudGridMobile)" mask="url(#hudRoundCornersMobile)"/>

  <!-- Watermark -->
  <text transform="translate(45, 345) rotate(-90)" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1.2" font-family="'Inter', system-ui, sans-serif" font-size="95" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="0.15em">CHAMATHZ</text>

  <!-- Animated Shine Sweep -->
  <g mask="url(#hudRoundCornersMobile)">
    <rect width="150" height="690" fill="url(#hudShineMobile)" transform="skewX(-25)">
      <animate attributeName="x" from="-250" to="650" dur="5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Header Section -->
  <g transform="translate(25, 20)">
    <circle cx="5" cy="8" r="4" fill="#58A6FF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="11" fill="#58A6FF" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.1em">TECH ARSENAL // TELEMETRY</text>
    <text x="0" y="30" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="800">Engineering Capabilities Matrix</text>
  </g>

