  <defs>
    <filter id="neonGlowMobile" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <mask id="roundCornersMobile">
      <rect width="450" height="340" rx="30" fill="white" />
    </mask>
    <mask id="boxMaskMobile">
       <rect width="400" height="65" rx="16" fill="white" />
    </mask>
    <linearGradient id="shineGradMobile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="50%" stop-color="white" stop-opacity="0.15" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="450" height="340" rx="30" fill="#0D1117" stroke="#30363D" stroke-width="2"/>


  <g transform="translate(25, 25)">
    <!-- Portfolio -->
    <g>
      <rect width="400" height="65" rx="16" fill="#161B22" fill-opacity="0.6" stroke="#30363D" stroke-width="1"/>
      <g mask="url(#boxMaskMobile)">
          <rect width="150" height="65" fill="url(#shineGradMobile)" transform="skewX(-20)">
            <animate attributeName="x" from="-200" to="500" dur="4s" repeatCount="indefinite" />
          </rect>
      </g>
      <g transform="translate(15, 17)">
         <circle cx="15" cy="15" r="11" stroke="#58A6FF" stroke-width="1.2"/>
         <ellipse cx="15" cy="15" rx="4" ry="11" stroke="#58A6FF" stroke-width="1"/>
      </g>
      <text x="60" y="25" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">PORTFOLIO</text>
      <text x="60" y="45" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">www.chamathz.com</text>
    </g>

    <!-- Currently Building -->
    <g transform="translate(0, 75)">
      <rect width="400" height="65" rx="16" fill="#161B22" fill-opacity="0.6" stroke="#30363D" stroke-width="1"/>
      <g mask="url(#boxMaskMobile)">
          <rect width="150" height="65" fill="url(#shineGradMobile)" transform="skewX(-20)">
            <animate attributeName="x" from="-200" to="500" dur="4s" begin="1s" repeatCount="indefinite" />
          </rect>
      </g>
      <g transform="translate(15, 17)">
         <rect x="7" y="4" width="16" height="22" rx="2" stroke="#79C0FF" stroke-width="1.5"/>
      </g>
      <text x="60" y="25" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">CURRENTLY BUILDING</text>
      <text x="60" y="45" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Smart Gowipala Android App</text>
    </g>

    <!-- Reach Me At -->
    <g transform="translate(0, 150)">
      <rect width="400" height="65" rx="16" fill="#161B22" fill-opacity="0.6" stroke="#30363D" stroke-width="1"/>
      <g mask="url(#boxMaskMobile)">
          <rect width="150" height="65" fill="url(#shineGradMobile)" transform="skewX(-20)">
            <animate attributeName="x" from="-200" to="500" dur="4s" begin="2s" repeatCount="indefinite" />
          </rect>
      </g>
      <g transform="translate(15, 20)">
         <path d="M2 4 H28 V22 H2 Z" stroke="#D14836" stroke-width="1.5" fill="none"/>
      </g>
      <text x="60" y="25" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">REACH ME AT</text>
      <text x="60" y="45" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">chamathsandaru.se@gmail.com</text>
    </g>

    <!-- Tech Focus -->
    <g transform="translate(0, 225)">
      <rect width="400" height="65" rx="16" fill="#161B22" fill-opacity="0.6" stroke="#30363D" stroke-width="1"/>
      <g mask="url(#boxMaskMobile)">
          <rect width="150" height="65" fill="url(#shineGradMobile)" transform="skewX(-20)">
            <animate attributeName="x" from="-200" to="500" dur="4s" begin="3s" repeatCount="indefinite" />
          </rect>
      </g>
      <g transform="translate(15, 17)">
         <path d="M15 4 Q 22 15 15 26 Q 8 15 15 4 Z" stroke="#FFD600" stroke-width="1.5"/>
      </g>
      <text x="60" y="25" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">TECH FOCUS</text>
      <text x="60" y="45" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Next.js • Spring Boot • Android</text>
    </g>
  </g>
</svg>
