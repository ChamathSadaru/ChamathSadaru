<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="60" viewBox="0 0 400 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Copyright (c) 2026 Chamath Sandaru. All rights reserved.
    Unauthorized use, copying, or redistribution of this asset is strictly prohibited.
    Repository: https://github.com/ChamathSadaru/ChamathSadaru
  -->
  <defs>
    <!-- Glow Filters -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="400" height="50" rx="10" fill="url(#bgGradient)" stroke="#30363D" stroke-width="1"/>
  
  <!-- Border Accent (Animated) -->
  <rect x="0.5" y="0.5" width="399" height="49" rx="9.5" stroke="#1F6FEB" stroke-width="1" stroke-opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.1; 0.4; 0.1" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Location Section -->
  <g transform="translate(15, 12)">
    <!-- Animated Location Pin -->
    <g transform="translate(8, 12)">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="8,12; 8,10; 8,12" 
        dur="2s" 
        repeatCount="indefinite" 
        calcMode="spline" 
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      <path d="M0 -10 C -5 -10, -9 -6, -9 -1 C -9 4, 0 11, 0 11 C 0 11, 9 4, 9 -1 C 9 -6, 5 -10, 0 -10 Z" fill="#1F6FEB" filter="url(#blueGlow)"/>
      <circle r="3" fill="#0D1117"/>
    </g>
    
    <!-- Location Label -->
    <rect x="30" y="0" width="70" height="26" rx="4" fill="#30363D" fill-opacity="0.4"/>
    <text x="38" y="18" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Location</text>
    
    <!-- Location Value -->
    <rect x="105" y="0" width="160" height="26" rx="4" fill="#1F6FEB" fill-opacity="0.1" stroke="#1F6FEB" stroke-opacity="0.3"/>
    <text x="115" y="18" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800">Gampaha, Sri Lanka</text>
  </g>

  <!-- Divider -->
  <line x1="285" y1="12" x2="285" y2="38" stroke="#30363D" stroke-width="1"/>

  <!-- Age Section -->
  <g transform="translate(300, 12)">
    <rect width="40" height="26" rx="4" fill="#30363D" fill-opacity="0.4"/>
    <text x="8" y="18" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Age</text>
    
    <rect x="45" y="0" width="35" height="26" rx="4" fill="#D18859" fill-opacity="0.15" stroke="#D18859" stroke-opacity="0.4"/>
    <text x="53" y="18" fill="#D18859" filter="url(#orangeGlow)" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="900">22</text>
  </g>
</svg>
