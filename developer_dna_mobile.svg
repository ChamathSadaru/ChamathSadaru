<svg width="450" height="460" viewBox="0 0 450 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Copyright (c) 2026 Chamath Sandaru. All rights reserved.
    Unauthorized use, copying, or redistribution of this asset is strictly prohibited.
    Repository: https://github.com/ChamathSadaru/ChamathSadaru
  -->
  <defs>
    <!-- Glow Filters -->
    <filter id="neonGlowMobile" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <mask id="terminalMaskMobile">
      <rect width="450" height="460" rx="20" fill="white" />
    </mask>

    <pattern id="termGridMobile" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="0.5"/>
    </pattern>

    <linearGradient id="headerGradMobile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="450" height="460" rx="20" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <rect width="450" height="460" rx="20" fill="url(#termGridMobile)" mask="url(#terminalMaskMobile)"/>

  <!-- Watermark -->
  <text transform="translate(40, 240) rotate(-90)" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1.2" font-family="'Inter', system-ui, sans-serif" font-size="90" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="0.1em">CHAMATHZ</text>

  <!-- Terminal Header Bar -->
  <path d="M0 20 C0 8.954 8.954 0 20 0 H430 C441.046 0 450 8.954 450 20 V42 H0 V20 Z" fill="url(#headerGradMobile)"/>
  <line x1="0" y1="42" x2="450" y2="42" stroke="#30363D" stroke-width="1"/>

  <!-- Window Controls -->
  <g transform="translate(18, 16)">
    <circle cx="5" cy="5" r="5" fill="#FF5F56"/>
    <circle cx="21" cy="5" r="5" fill="#FFBD2E"/>
    <circle cx="37" cy="5" r="5" fill="#27C93F"/>
  </g>

  <!-- Status / Title -->
  <g transform="translate(240, 21)">
    <text fill="#8B949E" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="500" text-anchor="middle">
      ~/dna/developer_core.json
    </text>
  </g>

  <g transform="translate(395, 16)">
    <circle cx="5" cy="5" r="3.5" fill="#2EA043">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Terminal Content Body -->
  <g transform="translate(20, 68)" font-family="'Fira Code', Consolas, monospace" font-size="12">
    <!-- Prompt line -->
    <text y="0">
      <tspan fill="#58A6FF" font-weight="700">chamath</tspan><tspan fill="#8B949E">:$ </tspan><tspan fill="#E6EDF3">cat developer_dna.json</tspan>
    </text>

    <text y="24" fill="#8B949E">{</text>

    <text y="46">
      <tspan fill="#79C0FF">  "dev"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"Chamath Sandaru"</tspan><tspan fill="#8B949E">,</tspan>
    </text>

    <text y="68">
      <tspan fill="#79C0FF">  "role"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"Software Engineering Student"</tspan><tspan fill="#8B949E">,</tspan>
    </text>

    <text y="90">
      <tspan fill="#79C0FF">  "institute"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"Java Institute (JIAT)"</tspan><tspan fill="#8B949E">,</tspan>
    </text>

    <text y="112">
      <tspan fill="#79C0FF">  "primary_stack"</tspan><tspan fill="#8B949E">: [</tspan>
    </text>
    <text y="132">
      <tspan fill="#58A6FF">    "Native Android (Java/Kotlin)"</tspan><tspan fill="#8B949E">,</tspan>
    </text>
    <text y="152">
      <tspan fill="#58A6FF">    "Spring Boot &amp; RESTful APIs"</tspan><tspan fill="#8B949E">,</tspan>
    </text>
    <text y="172">
      <tspan fill="#58A6FF">    "Next.js, React &amp; Tailwind"</tspan><tspan fill="#8B949E">,</tspan>
    </text>
    <text y="192">
      <tspan fill="#58A6FF">    "Hardware Sync &amp; Arduino/IoT"</tspan>
    </text>
    <text y="212" fill="#8B949E">  ],</text>

    <text y="234">
      <tspan fill="#79C0FF">  "building_now"</tspan><tspan fill="#8B949E">: </tspan>
    </text>
    <text y="254">
      <tspan fill="#F2CC60">    "Smart Gowipala App"</tspan><tspan fill="#8B949E">,</tspan>
    </text>

    <text y="276">
      <tspan fill="#79C0FF">  "methodologies"</tspan><tspan fill="#8B949E">: [</tspan>
    </text>
    <text y="296">
      <tspan fill="#D18859">    "Clean Architecture", "MVVM"</tspan>
    </text>
    <text y="316" fill="#8B949E">  ],</text>

    <text y="338">
      <tspan fill="#79C0FF">  "status"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#7EE787">"Ready to Innovate"</tspan>
    </text>

    <text y="360" fill="#8B949E">}</text>

    <text y="384">
      <tspan fill="#58A6FF" font-weight="700">chamath</tspan><tspan fill="#8B949E">:$ </tspan>
    </text>
    <rect x="100" y="373" width="7" height="14" rx="1" fill="#58A6FF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
