<svg width="850" height="350" viewBox="0 0 850 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Copyright (c) 2026 Chamath Sandaru. All rights reserved.
    Unauthorized use, copying, or redistribution of this asset is strictly prohibited.
    Repository: https://github.com/ChamathSadaru/ChamathSadaru
  -->
  <defs>
    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <mask id="terminalMask">
      <rect width="850" height="350" rx="20" fill="white" />
    </mask>

    <!-- Digital Grid Pattern -->
    <pattern id="termGrid" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="0.5"/>
    </pattern>

    <!-- Subtle Shine Gradient -->
    <linearGradient id="termShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="50%" stop-color="white" stop-opacity="0.1" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Pulsing Shimmer for Developer Name -->
    <linearGradient id="nameShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF; #79C0FF; #FFFFFF" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A5D6FF">
        <animate attributeName="stop-color" values="#A5D6FF; #FFFFFF; #A5D6FF" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Warm Radiant Glow for Current Project -->
    <linearGradient id="goldPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2CC60">
        <animate attributeName="stop-color" values="#F2CC60; #FFA611; #F2CC60" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFE885">
        <animate attributeName="stop-color" values="#FFE885; #F2CC60; #FFE885" dur="2.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Active Status Breathing Gradient -->
    <linearGradient id="statusPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7EE787">
        <animate attributeName="stop-color" values="#7EE787; #58A6FF; #7EE787" dur="3.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2EA043">
        <animate attributeName="stop-color" values="#2EA043; #7EE787; #2EA043" dur="3.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Command Typewriter ClipPath -->
    <clipPath id="cmdClip">
      <rect x="0" y="-16" width="0" height="24">
        <animate attributeName="width" values="0; 0; 240; 240; 0" keyTimes="0; 0.01; 0.07; 0.95; 1" dur="11s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Container Base -->
  <rect width="850" height="350" rx="20" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <rect width="850" height="350" rx="20" fill="url(#termGrid)" mask="url(#terminalMask)"/>

  <!-- Watermark -->
  <text x="425" y="205" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1.5" font-family="'Inter', system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="0.1em">CHAMATHZ</text>

  <!-- Animated Ambient Sweep -->
  <g mask="url(#terminalMask)">
    <rect width="180" height="350" fill="url(#termShine)" transform="skewX(-25)">
      <animate attributeName="x" from="-300" to="1100" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Futuristic CRT Scanline Glide -->
  <g mask="url(#terminalMask)">
    <rect x="0" y="42" width="850" height="4" fill="#58A6FF" fill-opacity="0.08">
      <animate attributeName="y" values="42; 340; 42" dur="5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Terminal Header Bar -->
  <path d="M0 20 C0 8.954 8.954 0 20 0 H830 C841.046 0 850 8.954 850 20 V42 H0 V20 Z" fill="url(#headerGrad)"/>
  <line x1="0" y1="42" x2="850" y2="42" stroke="#30363D" stroke-width="1"/>

  <!-- Window Controls -->
  <g transform="translate(24, 15)">
    <circle cx="6" cy="6" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/>
    <circle cx="26" cy="6" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/>
    <circle cx="46" cy="6" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/>
  </g>

  <!-- Header Title -->
  <g transform="translate(425, 25)">
    <text fill="#8B949E" font-family="'Fira Code', Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="0.04em">
      chamath@arch-system: ~/dna/developer_core.json
    </text>
  </g>

  <!-- Live Status Badge -->
  <g transform="translate(710, 12)">
    <rect width="116" height="20" rx="10" fill="#1F6FEB" fill-opacity="0.1" stroke="#1F6FEB" stroke-opacity="0.3"/>
    <circle cx="12" cy="10" r="3.5" fill="#2EA043">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="14" fill="#58A6FF" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">ONLINE / COMPILING</text>
  </g>

  <!-- ================= TERMINAL CONTENT WITH SEQUENTIAL COMPILER ANIMATION ================= -->
  <g transform="translate(32, 70)" font-family="'Fira Code', Consolas, monospace" font-size="13.5">
    
    <!-- Prompt & Typewriter Command -->
    <g transform="translate(0, 0)">
      <text y="0">
        <tspan fill="#58A6FF" font-weight="700">chamath@system</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#79C0FF">~/core</tspan><tspan fill="#8B949E">$ </tspan>
      </text>
      <!-- Typed text reveal -->
      <g transform="translate(182, 0)">
        <g clip-path="url(#cmdClip)">
          <text y="0" fill="#E6EDF3">cat developer_dna.json</text>
        </g>
      </g>
    </g>

    <!-- Line 0: { -->
    <g transform="translate(0, 24)">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.08; 0.09; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 28; 0 28; 0 24; 0 24; 0 24" keyTimes="0; 0.08; 0.09; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <text fill="#8B949E">{</text>
    </g>

    <!-- Line 1: developer -->
    <g transform="translate(0, 48)">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.11; 0.12; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 52; 0 52; 0 48; 0 48; 0 48" keyTimes="0; 0.11; 0.12; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <text>
        <tspan fill="#79C0FF">  "developer"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="url(#nameShimmer)" font-weight="700">"Chamath Sandaru"</tspan><tspan fill="#8B949E">,</tspan>
      </text>
    </g>

    <!-- Line 2: identity -->
    <g transform="translate(0, 72)">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.14; 0.15; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 76; 0 76; 0 72; 0 72; 0 72" keyTimes="0; 0.14; 0.15; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <text>
        <tspan fill="#79C0FF">  "identity"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"Software Engineering Student &amp; Full-Stack Builder"</tspan><tspan fill="#8B949E">,</tspan>
      </text>
    </g>

    <!-- Line 3: academy -->
    <g transform="translate(0, 96)">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.17; 0.18; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 100; 0 100; 0 96; 0 96; 0 96" keyTimes="0; 0.17; 0.18; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <text>
        <tspan fill="#79C0FF">  "academy"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#A5D6FF">"Java Institute for Advanced Technology"</tspan><tspan fill="#8B949E">,</tspan>
      </text>
    </g>

    <!-- Line 4: core_stack -->
    <g transform="translate(0, 120)">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.20; 0.21; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 124; 0 124; 0 120; 0 120; 0 120" keyTimes="0; 0.20; 0.21; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <text>
        <tspan fill="#79C0FF">  "core_stack"</tspan><tspan fill="#8B949E">: [ </tspan><tspan fill="#58A6FF">"Native Android"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#58A6FF">"Spring Boot"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#58A6FF">"Next.js"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#58A6FF">"IoT / C++"</tspan><tspan fill="#8B949E"> ],</tspan>
      </text>
    </g>

    <!-- Line 5: engineering_discipline -->
    <g transform="translate(0, 144)">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.23; 0.24; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 148; 0 148; 0 144; 0 144; 0 144" keyTimes="0; 0.23; 0.24; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <text>
        <tspan fill="#79C0FF">  "engineering_discipline"</tspan><tspan fill="#8B949E">: [ </tspan><tspan fill="#D18859">"Clean Code"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#D18859">"MVVM Architecture"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#D18859">"RESTful Microservices"</tspan><tspan fill="#8B949E"> ],</tspan>
      </text>
    </g>

    <!-- Line 6: current_project -->
    <g transform="translate(0, 168)">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.26; 0.27; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 172; 0 172; 0 168; 0 168; 0 168" keyTimes="0; 0.26; 0.27; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <text>
        <tspan fill="#79C0FF">  "current_project"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="url(#goldPulse)" font-weight="700">"Smart Gowipala (Android + IoT)"</tspan><tspan fill="#8B949E">,</tspan>
      </text>
    </g>

    <!-- Line 7: active_status -->
    <g transform="translate(0, 192)">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.29; 0.30; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 196; 0 196; 0 192; 0 192; 0 192" keyTimes="0; 0.29; 0.30; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <text>
        <tspan fill="#79C0FF">  "active_status"</tspan><tspan fill="#8B949E">: </tspan><tspan fill="url(#statusPulse)" font-weight="700">"Open to scalable enterprise &amp; IoT collaborations"</tspan>
      </text>
    </g>

    <!-- Line 8: } -->
    <g transform="translate(0, 216)">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.32; 0.33; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 220; 0 220; 0 216; 0 216; 0 216" keyTimes="0; 0.32; 0.33; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <text fill="#8B949E">}</text>
    </g>

    <!-- Line 9: Trailing prompt with blinking cursor -->
    <g transform="translate(0, 244)">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.35; 0.36; 0.95; 1" dur="11s" repeatCount="indefinite" />
      <text>
        <tspan fill="#58A6FF" font-weight="700">chamath@system</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#79C0FF">~/core</tspan><tspan fill="#8B949E">$ </tspan>
      </text>
      <rect x="180" y="-11" width="8" height="15" rx="1" fill="#58A6FF" filter="url(#cyanGlow)">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
