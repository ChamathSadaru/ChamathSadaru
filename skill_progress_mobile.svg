<svg width="450" height="600" viewBox="0 0 450 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Copyright (c) 2026 Chamath Sandaru. All rights reserved.
    Unauthorized use, copying, or redistribution of this asset is strictly prohibited.
    Repository: https://github.com/ChamathSadaru/ChamathSadaru
  -->
  <defs>
    <!-- Glassmorphism Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Linear Gradient for Tags -->
    <linearGradient id="tagGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0.02" />
    </linearGradient>

    <!-- Animated Pulse Gradient for Android Development -->
    <radialGradient id="pulseGradientMobile" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#3DDC84">
        <animate attributeName="stop-color" values="#3DDC84; #FFFFFF; #3DDC84" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2EA043" />
    </radialGradient>

    <filter id="textPulseMobile" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur">
        <animate attributeName="stdDeviation" values="1; 3; 1" dur="2s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Container -->
  <rect width="450" height="600" rx="40" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  
  <!-- Background Watermark (Left Vertical) -->
  <text transform="translate(60, 300) rotate(-90)" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" font-family="Inter, system-ui, sans-serif" font-size="120" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.02em">ChamathZ</text>
  
  <!-- Icon Container (Centered Top) -->
  <g transform="translate(225, 110)">
    <!-- Animated Outer Ring -->
    <circle r="50" fill="#161B22" stroke="#3DDC84" stroke-width="2.5" stroke-dasharray="200 120" stroke-linecap="round">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 0 0" 
        to="360 0 0" 
        dur="4s" 
        repeatCount="indefinite" />
    </circle>
    
    <!-- Animated Android Bugdroid Icon (Floating Effect) -->
    <g transform="translate(0, -3)">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0 -3; 0 -7; 0 -3" 
        dur="3s" 
        repeatCount="indefinite" 
        calcMode="spline" 
        keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      
      <!-- Antennae -->
      <line x1="-9" y1="-14" x2="-15" y2="-22" stroke="#3DDC84" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="9" y1="-14" x2="15" y2="-22" stroke="#3DDC84" stroke-width="2.8" stroke-linecap="round"/>

      <!-- Head -->
      <path d="M -17,-3.5 A 17,17 0 0,1 17,-3.5 Z" fill="#3DDC84"/>
      <!-- Eyes -->
      <circle cx="-6.2" cy="-10.5" r="1.8" fill="#161B22"/>
      <circle cx="6.2" cy="-10.5" r="1.8" fill="#161B22"/>

      <!-- Body -->
      <path d="M -17,1 L 17,1 L 17,17 A 4.5,4.5 0 0,1 12.5,21.5 L -12.5,21.5 A 4.5,4.5 0 0,1 -17,17 Z" fill="#3DDC84"/>

      <!-- Arms -->
      <rect x="-22.5" y="1" width="3.6" height="15" rx="1.8" fill="#3DDC84"/>
      <rect x="18.9" y="1" width="3.6" height="15" rx="1.8" fill="#3DDC84"/>

      <!-- Legs -->
      <rect x="-10" y="21.5" width="3.8" height="8" rx="1.9" fill="#3DDC84"/>
      <rect x="6.2" y="21.5" width="3.8" height="8" rx="1.9" fill="#3DDC84"/>
    </g>
  </g>
  
  <!-- Title Section (Centered) -->
  <g transform="translate(225, 215)">
    <text y="0" fill="#3DDC84" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="0.15em">NOW I AM DEEP DIVING</text>
    <text y="45" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="900" text-anchor="middle">Android <tspan fill="url(#pulseGradientMobile)" filter="url(#textPulseMobile)">Development</tspan></text>
    <text y="72" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Native Mobile Ecosystem</text>
  </g>

  <!-- Smart Tech Stack Highlights (Android Pillars) -->
  <g transform="translate(225, 340)">
    <!-- Point 1: Kotlin & Jetpack -->
    <g transform="translate(-115, 0)">
      <rect width="230" height="34" rx="17" fill="url(#tagGradient)" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" repeatCount="indefinite" />
      </rect>
      <path d="M18 17h6m-3-3v6" stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round"/>
      <text x="34" y="21" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800">Kotlin &amp; Jetpack</text>
    </g>
    
    <!-- Point 2: MVVM & Coroutines -->
    <g transform="translate(-115, 48)">
      <rect width="230" height="34" rx="17" fill="url(#tagGradient)" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" begin="1s" repeatCount="indefinite" />
      </rect>
      <circle cx="21" cy="17" r="3" fill="#3DDC84" fill-opacity="0.8"/>
      <text x="34" y="21" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800">MVVM &amp; Coroutines</text>
    </g>
    
    <!-- Point 3: Room DB & Retrofit -->
    <g transform="translate(-115, 96)">
      <rect width="230" height="34" rx="17" fill="url(#tagGradient)" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" begin="2s" repeatCount="indefinite" />
      </rect>
      <path d="M16 17l4 4 6-6" stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="21" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800">Room DB &amp; Retrofit</text>
    </g>
  </g>

  <!-- Utils / Tech Section (Bottom Centered) -->
  <g transform="translate(225, 520)">
    <!-- Label -->
    <text y="0" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.02em">next move to</text>

    <!-- Smart Pill -->
    <g transform="translate(-65, 15)">
      <rect width="130" height="36" rx="18" fill="#161B22" stroke="#2EA043" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="10 5">
        <animate attributeName="stroke-dashoffset" from="0" to="15" dur="3s" repeatCount="indefinite" />
      </rect>
      <circle cx="20" cy="18" r="3" fill="#2EA043"/>
      <text x="70" y="22" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Spring Boot</text>
    </g>
  </g>
</svg>
