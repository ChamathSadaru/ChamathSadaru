<svg width="390" height="710" viewBox="0 0 390 710" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glassmorphism Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Linear Gradient for Tags -->
    <linearGradient id="tagGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0" />
    </linearGradient>

    <!-- Animated Pulse Gradient for Android Architecture -->
    <radialGradient id="pulseGradientMobile" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF; #FFFFFF; #58A6FF" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1F6FEB" />
    </radialGradient>

    <filter id="textPulseMobile" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur">
        <animate attributeName="stdDeviation" values="1; 3; 1" dur="2s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Container -->
  <rect width="450" height="600" rx="40" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  
  <!-- Background Watermark (Left Vertical) -->
  <text transform="translate(60, 300) rotate(-90)" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" font-family="Inter, system-ui, sans-serif" font-size="120" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.02em">ChamathZ</text>
  
  <!-- Icon Container (Centered Top) -->
  <g transform="translate(225, 110)">
    <!-- Animated Outer Ring -->
    <circle r="50" fill="#161B22" stroke="#1F6FEB" stroke-width="2.5" stroke-dasharray="200 120" stroke-linecap="round">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 0 0" 
        to="360 0 0" 
        dur="4s" 
        repeatCount="indefinite" />
    </circle>
    
    <!-- Animated Inner Static Icon (Floating Effect) -->
    <g>
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0 0; 0 -3; 0 0" 
        dur="3s" 
        repeatCount="indefinite" 
        calcMode="spline" 
        keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      <rect x="-10" y="-18" width="20" height="36" rx="3" stroke="#58A6FF" stroke-width="2.5" fill="none"/>
      <circle cy="12" r="2" fill="#58A6FF"/>
    </g>
  </g>
  
  <!-- Title Section (Centered) -->
  <g transform="translate(225, 215)">
    <text y="0" fill="#58A6FF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="0.15em">NOW I AM DEEP DIVING</text>
    <text y="45" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="900" text-anchor="middle">Android <tspan fill="url(#pulseGradientMobile)" filter="url(#textPulseMobile)">Architecture</tspan></text>
    <text y="72" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Native Java Ecosystem</text>
  </g>

  <!-- Smart Tech Stack Highlights (Stacked Centered) -->
  <g transform="translate(225, 340)">
    <!-- Native Android Tag -->
    <g transform="translate(-110, 0)">
      <rect width="220" height="34" rx="17" fill="url(#tagGradient)" stroke="#1F6FEB" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" repeatCount="indefinite" />
      </rect>
      <path d="M20 17h6m-3-3v6" stroke="#58A6FF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="38" y="21" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">Native Android</text>
    </g>
    
    <!-- Firebase Backend Tag -->
    <g transform="translate(-110, 48)">
      <rect width="220" height="34" rx="17" fill="url(#tagGradient)" stroke="#1F6FEB" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" begin="1s" repeatCount="indefinite" />
      </rect>
      <circle cx="23" cy="17" r="3" fill="#58A6FF" fill-opacity="0.8"/>
      <text x="38" y="21" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">Firebase Backend</text>
    </g>
    
    <!-- Java Backend Tag -->
    <g transform="translate(-110, 96)">
      <rect width="220" height="34" rx="17" fill="url(#tagGradient)" stroke="#1F6FEB" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" begin="2s" repeatCount="indefinite" />
      </rect>
      <path d="M18 17l4 4 6-6" stroke="#58A6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="21" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">Java Backend</text>
    </g>
  </g>

  <!-- Utils / Tech Section (Bottom Centered) -->
  <g transform="translate(225, 520)">
    <!-- Label -->
    <text y="0" fill="#484F58" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.02em">next move to</text>

    <!-- Smart Pill -->
    <g transform="translate(-60, 15)">
      <rect width="120" height="36" rx="18" fill="#161B22" stroke="#1F6FEB" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="10 5">
        <animate attributeName="stroke-dashoffset" from="0" to="15" dur="3s" repeatCount="indefinite" />
      </rect>
      <text x="60" y="23" fill="#484F58" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Spring Boot</text>
    </g>
  </g>
</svg>
