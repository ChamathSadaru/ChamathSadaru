<svg width="450" height="520" viewBox="0 0 450 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glassmorphism Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Linear Gradient for Tags -->
    <linearGradient id="tagGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="450" height="520" rx="40" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  
  <!-- Background Watermark -->
  <text x="225" y="260" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" font-family="Inter, system-ui, sans-serif" font-size="80" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.02em">ChamathZ</text>
  
  <!-- Icon Container (Centered Top) -->
  <g transform="translate(225, 80)">
    <!-- Animated Outer Ring -->
    <circle r="42" fill="#161B22" stroke="#1F6FEB" stroke-width="2.5" stroke-dasharray="160 100" stroke-linecap="round">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 0 0" 
        to="360 0 0" 
        dur="4s" 
        repeatCount="indefinite" />
    </circle>
    
    <!-- Animated Inner Static Icon (Floating Effect) -->
    <g>
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0 0; 0 -2; 0 0" 
        dur="3s" 
        repeatCount="indefinite" 
        calcMode="spline" 
        keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      <rect x="-8" y="-14" width="16" height="28" rx="2" stroke="#58A6FF" stroke-width="2" fill="none"/>
      <circle cy="10" r="1.5" fill="#58A6FF"/>
    </g>
  </g>
  
  <!-- Title Section (Centered) -->
  <g transform="translate(225, 160)">
    <g transform="translate(-80, 0)">
      <circle cx="3" cy="5" r="3" fill="#1F6FEB"/>
      <text x="13" y="10" fill="#58A6FF" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="0.1em">NOW I AM DEEP DIVING</text>
    </g>
    <text y="45" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">Android Architecture</text>
    <text y="68" fill="#8B949E" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Native Java Ecosystem</text>
  </g>

  <!-- Smart Tech Stack Highlights (Stacked Centered) -->
  <g transform="translate(155, 260)">
    <!-- Native Android Tag -->
    <g transform="translate(0, 0)">
      <rect width="140" height="28" rx="14" fill="url(#tagGradient)" stroke="#1F6FEB" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" repeatCount="indefinite" />
      </rect>
      <path d="M12 14h4m-2-2v4" stroke="#58A6FF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="28" y="18" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800">Native Android</text>
    </g>
    
    <!-- Firebase Backend Tag -->
    <g transform="translate(0, 40)">
      <rect width="140" height="28" rx="14" fill="url(#tagGradient)" stroke="#1F6FEB" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" begin="1s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="14" r="2.5" fill="#58A6FF" fill-opacity="0.8"/>
      <text x="28" y="18" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800">Firebase Backend</text>
    </g>
    
    <!-- Java Backend Tag -->
    <g transform="translate(0, 80)">
      <rect width="140" height="28" rx="14" fill="url(#tagGradient)" stroke="#1F6FEB" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4; 0.8; 0.4" dur="3s" begin="2s" repeatCount="indefinite" />
      </rect>
      <path d="M10 14l3 3 5-5" stroke="#58A6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="18" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800">Java Backend</text>
    </g>
  </g>

  <!-- Utils / Tech Section (Bottom Centered) -->
  <g transform="translate(225, 420)">
    <!-- Label -->
    <text y="0" fill="#484F58" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.02em">next move to</text>

    <!-- Smart Pill -->
    <g transform="translate(-50, 15)">
      <rect width="100" height="32" rx="16" fill="#161B22" stroke="#1F6FEB" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="10 5">
        <animate attributeName="stroke-dashoffset" from="0" to="15" dur="3s" repeatCount="indefinite" />
      </rect>
      <text x="50" y="21" fill="#484F58" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Spring Boot</text>
    </g>
  </g>
</svg>
